<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="<?!= include('BrandIconDataUri'); ?>">
    <style>
      :root {
        --ink: #17201f;
        --muted: #66716f;
        --line: #dfe7e4;
        --surface: #ffffff;
        --soft: #f6f4ec;
        --green: #154846;
        --brand-deep: #065f46;
        --brand-bright: #10b981;
        --red: #b42318;
        --shadow: 0 16px 50px rgba(23, 32, 31, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: #f3f1e8;
        font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        max-width: 1220px;
        margin: 0 auto;
        padding: 22px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }

      .brand-copy {
        min-width: 0;
      }

      .logo {
        width: 58px;
        height: 58px;
        border-radius: 0;
        background: transparent;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .brand-icon-art {
        width: 58px;
        height: 58px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgba(23, 32, 31, 0.2));
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand-wordmark {
        display: flex;
        align-items: baseline;
        font-size: 29px;
        font-weight: 900;
        line-height: 0.95;
      }

      .brand-wordmark .tracker {
        color: var(--brand-deep);
      }

      .brand-wordmark .pal {
        color: var(--brand-bright);
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .btn:hover {
        border-color: #b8c9c5;
      }

      .btn.primary {
        color: #fff;
        background: var(--green);
        border-color: var(--green);
      }

      .btn.warn {
        color: #065f46;
        background: #e7f6ed;
        border-color: #9acdb1;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      .stat strong {
        display: block;
        font-size: 24px;
        line-height: 1;
        margin-bottom: 6px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
      }

      .workspace {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .search {
        min-height: 40px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: #fbfcfb;
      }

      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .chip {
        min-height: 34px;
        padding: 0 10px;
        border-radius: 999px;
        background: #f7f9f8;
        border: 1px solid var(--line);
        color: var(--muted);
      }

      .chip.active {
        background: #e2f2ef;
        color: var(--green);
        border-color: #a4d5cd;
      }

      .orders {
        max-height: calc(100vh - 270px);
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }

      th,
      td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #fbfcfb;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      tr:hover td {
        background: #fafbf8;
      }

      .item-title {
        font-weight: 700;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        min-width: 150px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        min-height: 36px;
        padding: 0 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .pill.overdue,
      .pill.exception {
        background: #fce8e6;
        color: var(--red);
      }

      .pill.today {
        background: #dff7e9;
        color: #065f46;
      }

      .pill.delivered {
        background: #e6f4ea;
        color: #137333;
      }

      .pill.missing {
        background: #eef2f1;
        color: #4f5b58;
      }

      .empty,
      .loading {
        padding: 52px 20px;
        text-align: center;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--green);
        color: #fff;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(8px);
        transition: 160ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(23, 32, 31, 0.38);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(680px, 100%);
        background: #fff;
        border-radius: 8px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
      }

      .modal header,
      .modal footer {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .modal footer {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        justify-content: flex-end;
      }

      .modal h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      .field input,
      .field select,
      .field textarea {
        min-height: 40px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 8px 10px;
        width: 100%;
      }

      textarea {
        resize: vertical;
        min-height: 72px;
      }

      .received {
        width: 20px;
        height: 20px;
      }

      @media (max-width: 860px) {
        .app {
          padding: 12px;
        }

        .topbar,
        .toolbar {
          grid-template-columns: 1fr;
        }

        .actions,
        .filters {
          justify-content: flex-start;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .orders {
          max-height: none;
        }

        .form {
          grid-template-columns: 1fr;
        }

        .brand-wordmark {
          font-size: 27px;
        }

        .logo,
        .brand-icon-art {
          width: 54px;
          height: 54px;
        }
      }

      /* TrackerPal's operation-first visual system: a crisp shipping console. */
      :root {
        --ink: #10271f;
        --muted: #586d64;
        --line: #d6e3dc;
        --surface: #ffffff;
        --soft: #f3f8f5;
        --green: #08734b;
        --brand-deep: #065f46;
        --brand-bright: #10b981;
        --red: #b42318;
        --shadow: 0 18px 45px rgba(16, 39, 31, 0.12);
        --focus: #087a55;
      }

      ::selection { background: #d1fae5; color: var(--ink); }

      body {
        background:
          radial-gradient(circle at 12% 0%, rgba(23, 137, 95, 0.14), transparent 30rem),
          linear-gradient(180deg, #edf5f0 0, #f8faf9 24rem, #eef4f0 100%);
      }

      .app { max-width: 1360px; padding: 28px clamp(16px, 3vw, 40px) 40px; }
      .topbar { margin-bottom: 24px; }
      .brand { gap: 14px; }
      .logo, .brand-icon-art { width: 64px; height: 64px; }
      .brand-wordmark { font-size: 31px; letter-spacing: -0.025em; }
      .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
      .actions { gap: 10px; }

      .btn {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid #c8d9d0;
        font-weight: 750;
        box-shadow: 0 3px 10px rgba(16, 35, 59, 0.05);
        transition: transform 140ms ease-out, box-shadow 140ms ease-out, background-color 140ms ease-out, border-color 140ms ease-out;
      }
      .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #93b7a4; box-shadow: 0 7px 16px rgba(0, 0, 0, 0.1); }
      .btn:active:not(:disabled) { transform: translateY(0); }
      .btn.primary { background: var(--green); border-color: var(--green); }
      .btn.primary:hover:not(:disabled) { background: #065e3d; border-color: #065e3d; }
      .btn.warn { background: #e7f6ed; border-color: #9acdb1; color: #065f46; }
      .btn:disabled { cursor: wait; opacity: 0.58; }

      :where(button, input, select, textarea, a):focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .stats { grid-template-columns: repeat(7, minmax(105px, 1fr)); gap: 12px; margin-bottom: 18px; }
      .stat {
        position: relative;
        min-height: 94px;
        padding: 18px;
        border: 0;
        border-radius: 14px;
        box-shadow: 0 7px 24px rgba(16, 39, 31, 0.07);
        overflow: hidden;
      }
      .stat::after { content: ""; position: absolute; inset: auto 0 0; height: 4px; background: var(--stat-color, #8aa99a); }
      .stat[data-stat="Overdue"], .stat[data-stat="Exceptions"] { --stat-color: #d34b42; }
      .stat[data-stat="Due Today"] { --stat-color: #10b981; }
      .stat[data-stat="Delivered"], .stat[data-stat="Received"] { --stat-color: #2d9874; }
      .stat[data-stat="Missing ETA"] { --stat-color: #71847a; }
      .stat strong { font-size: 30px; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 12px; font-weight: 720; text-transform: uppercase; letter-spacing: 0.045em; }

      .workspace { width: 100%; min-width: 0; border: 0; border-radius: 16px; box-shadow: var(--shadow); }
      .toolbar { padding: 16px 18px; background: #fff; }
      .search { min-height: 46px; border-radius: 12px; padding: 0 15px; background: var(--soft); }
      .search::placeholder { color: var(--muted); opacity: 1; }
      .chip { min-height: 44px; padding: 0 13px; font-weight: 700; color: #4d6258; }
      .chip:hover { border-color: #a5bfb1; background: #eef6f2; }
      .chip.active { background: #ddf3e7; color: #075f3e; border-color: #84c8a6; }
      .orders { width: 100%; min-width: 0; max-height: calc(100vh - 306px); scrollbar-color: #9bb5a7 #edf5f0; scrollbar-width: thin; }
      th { padding-block: 14px; background: #f3f8f5; color: #4d6258; text-transform: uppercase; letter-spacing: 0.045em; }
      td { padding-block: 15px; }
      tr:last-child td { border-bottom: 0; }
      tr:hover td { background: #f5faf7; }
      .item-title { color: #10271f; }
      .item-sub { color: #5f7369; line-height: 1.4; }
      .status { min-height: 44px; border-radius: 10px; border-color: #c8d9d0; }
      a { color: #087a55; font-weight: 700; text-underline-offset: 3px; }
      .received { accent-color: var(--green); }
      .received-control { width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; }
      .empty, .loading, .error-state { min-height: 250px; display: grid; place-content: center; gap: 10px; padding: 52px 20px; text-align: center; color: var(--muted); }
      .empty strong, .error-state strong { color: var(--ink); font-size: 18px; }
      .toast { border-radius: 12px; box-shadow: 0 16px 36px rgba(16, 35, 59, 0.22); transition: 180ms cubic-bezier(.2,.8,.2,1); }
      .modal-backdrop { z-index: 10; background: rgba(11, 27, 45, 0.58); backdrop-filter: blur(5px); }
      .modal { border: 0; border-radius: 16px; overflow: hidden; }
      .modal header, .modal footer { padding: 18px 20px; }
      .modal h2 { font-size: 22px; letter-spacing: -0.02em; }
      .form { gap: 16px; padding: 20px; }
      label { color: #4d6258; }
      .field input, .field select, .field textarea { min-height: 44px; border-radius: 10px; border-color: #c8d9d0; background: #fbfdfc; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }

      @media (max-width: 1080px) {
        .stats { grid-template-columns: repeat(4, 1fr); }
        .orders { max-height: none; }
      }

      @media (max-width: 680px) {
        .app { padding: 16px 12px 28px; }
        .topbar { gap: 18px; }
        .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .actions .btn { justify-content: center; }
        .actions .primary { grid-column: 1 / -1; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        .stat { min-height: 86px; padding: 15px; }
        .stat:last-child { grid-column: 1 / -1; }
        .toolbar { padding: 14px; }
        .filters { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding-bottom: 5px; scrollbar-color: #89a597 #edf5f0; scrollbar-width: thin; }
        .chip { flex: 0 0 auto; }
        .form { grid-template-columns: 1fr; max-height: 66vh; overflow-y: auto; }
        .field.full { grid-column: auto; }
        .modal-backdrop { align-items: flex-end; padding: 8px; }
        .modal { border-radius: 16px 16px 10px 10px; }
        table { min-width: 0; }
        thead { display: none; }
        tbody { display: grid; }
        tr { display: grid; grid-template-columns: 42px 1fr; padding: 14px; border-bottom: 1px solid var(--line); }
        td { display: grid; grid-column: 2; grid-template-columns: minmax(82px, 0.42fr) 1fr; gap: 10px; align-items: center; padding: 8px 0; border: 0; }
        td::before { content: attr(data-label); color: #5f7369; font-size: 11px; font-weight: 750; letter-spacing: 0.04em; text-transform: uppercase; }
        td:first-child { grid-column: 1; grid-row: 1 / span 5; display: block; padding-top: 10px; }
        td:first-child::before { content: none; }
        .item-title, .item-sub { max-width: none; white-space: normal; }
        .status { width: 100%; min-width: 0; }
      }
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <section class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <?!= include('BrandIcon'); ?>
          </div>
          <div class="brand-copy">
            <h1 class="brand-wordmark" aria-label="TrackerPal"><span class="tracker">Tracker</span><span class="pal">Pal</span></h1>
            <div class="meta" id="meta">Loading latest package status…</div>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="sheetBtn" type="button">Open Sheet</button>
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
          <button class="btn primary" id="addBtn" type="button">Add Order</button>
        </div>
      </section>

      <section class="stats" id="stats"></section>

      <section class="workspace">
        <div class="toolbar">
          <input class="search" id="search" type="search" aria-label="Search orders" placeholder="Search orders, stores, or tracking numbers">
          <div class="filters" id="filters"></div>
        </div>
        <div class="orders" id="orders">
          <div class="loading">Loading TrackerPal...</div>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
      <form class="modal" id="manualForm">
        <header>
          <h2 id="modalTitle">Add Order</h2>
          <button class="btn" type="button" id="closeModalBtn">Close</button>
        </header>
        <div class="form">
          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option>Ordered</option>
              <option>Shipped</option>
              <option>Out for delivery</option>
              <option>Delivered</option>
              <option>Exception</option>
            </select>
          </div>
          <div class="field">
            <label for="store">Store</label>
            <input id="store" name="store" autocomplete="organization">
          </div>
          <div class="field full">
            <label for="item">Item</label>
            <input id="item" name="item">
          </div>
          <div class="field">
            <label for="orderNumber">Order Number</label>
            <input id="orderNumber" name="orderNumber">
          </div>
          <div class="field">
            <label for="carrier">Carrier</label>
            <input id="carrier" name="carrier" list="carriers">
            <datalist id="carriers">
              <option value="Amazon Logistics"></option>
              <option value="UPS"></option>
              <option value="FedEx"></option>
              <option value="USPS"></option>
              <option value="DHL"></option>
              <option value="OnTrac"></option>
              <option value="Veho"></option>
              <option value="Pitney Bowes"></option>
              <option value="GLS"></option>
            </datalist>
          </div>
          <div class="field">
            <label for="trackingNumber">Tracking Number</label>
            <input id="trackingNumber" name="trackingNumber">
          </div>
          <div class="field">
            <label for="estimatedArrival">Estimated Arrival</label>
            <input id="estimatedArrival" name="estimatedArrival" type="date">
          </div>
          <div class="field full">
            <label for="trackingUrl">Tracking URL</label>
            <input id="trackingUrl" name="trackingUrl" type="url">
          </div>
          <div class="field full">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes"></textarea>
          </div>
        </div>
        <footer>
          <button class="btn" type="button" id="cancelBtn">Cancel</button>
          <button class="btn primary" type="submit">Save Order</button>
        </footer>
      </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const statusOptions = ["Ordered", "Shipped", "Out for delivery", "Delivered", "Exception"];
      const filters = [
        ["open", "Open"],
        ["today", "Due Today"],
        ["overdue", "Overdue"],
        ["exception", "Exceptions"],
        ["delivered", "Delivered"],
        ["missing", "Missing ETA"],
        ["all", "All"]
      ];
      let state = null;
      let activeFilter = "open";
      let searchTerm = "";
      let lastFocusedElement = null;
      let focusAfterRender = "";

      const $ = (id) => document.getElementById(id);

      document.addEventListener("DOMContentLoaded", () => {
        $("refreshBtn").addEventListener("click", loadState);
        $("addBtn").addEventListener("click", openModal);
        $("closeModalBtn").addEventListener("click", closeModal);
        $("cancelBtn").addEventListener("click", closeModal);
        $("sheetBtn").addEventListener("click", () => state && state.sheetUrl && window.open(state.sheetUrl, "_blank", "noopener"));
        $("search").addEventListener("input", (event) => {
          searchTerm = event.target.value.toLowerCase();
          renderOrders();
        });
        $("manualForm").addEventListener("submit", saveManualOrder);
        $("modalBackdrop").addEventListener("click", (event) => {
          if (event.target === event.currentTarget) closeModal();
        });
        document.addEventListener("keydown", handleKeydown);
        renderFilters();
        loadState();
      });

      function loadState() {
        setBusy(true);
        google.script.run
          .withSuccessHandler((nextState) => {
            state = nextState;
            setBusy(false);
            render();
          })
          .withFailureHandler(showError)
          .getTrackerPalState();
      }

      function saveManualOrder(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const entry = Object.fromEntries(form.entries());
        setBusy(true);
        google.script.run
          .withSuccessHandler((result) => {
            state = result.state;
            setBusy(false);
            closeModal();
            render();
            toast(`Manual order ${result.action}.`);
          })
          .withFailureHandler(showError)
          .addTrackerPalManualOrder(entry);
      }

      function setReceived(rowIndex, received) {
        focusAfterRender = `[data-received-row="${rowIndex}"]`;
        setBusy(true);
        google.script.run
          .withSuccessHandler((nextState) => {
            state = nextState;
            setBusy(false);
            render();
          })
          .withFailureHandler(showError)
          .setTrackerPalReceived(rowIndex, received);
      }

      function updateStatus(rowIndex, status) {
        focusAfterRender = `[data-status-row="${rowIndex}"]`;
        setBusy(true);
        google.script.run
          .withSuccessHandler((nextState) => {
            state = nextState;
            setBusy(false);
            render();
          })
          .withFailureHandler(showError)
          .updateTrackerPalStatus(rowIndex, status);
      }

      function render() {
        $("meta").textContent = `v${state.version} - ${state.generatedAt}`;
        renderStats();
        renderFilters();
        renderOrders();
      }

      function renderStats() {
        const items = [
          ["Open", state.stats.open],
          ["Overdue", state.stats.overdue],
          ["Due Today", state.stats.dueToday],
          ["Exceptions", state.stats.exceptions],
          ["Delivered", state.stats.delivered],
          ["Missing ETA", state.stats.missingEta],
          ["Received", state.stats.received]
        ];
        $("stats").innerHTML = items.map(([label, value]) => `
          <div class="stat" data-stat="${escapeAttr(label)}">
            <strong>${escapeHtml(value)}</strong>
            <span>${escapeHtml(label)}</span>
          </div>
        `).join("");
      }

      function renderFilters() {
        $("filters").innerHTML = filters.map(([key, label]) => `
          <button class="chip ${activeFilter === key ? "active" : ""}" type="button" data-filter="${key}" aria-pressed="${activeFilter === key}">
            ${escapeHtml(label)}
          </button>
        `).join("");
        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            activeFilter = button.dataset.filter;
            document.querySelectorAll("[data-filter]").forEach((filterButton) => {
              const selected = filterButton.dataset.filter === activeFilter;
              filterButton.classList.toggle("active", selected);
              filterButton.setAttribute("aria-pressed", String(selected));
            });
            renderOrders();
          });
        });
      }

      function renderOrders() {
        if (!state) {
          $("orders").innerHTML = '<div class="loading">Loading TrackerPal...</div>';
          return;
        }

        const orders = state.orders.filter(matchesFilter).filter(matchesSearch).sort(sortOrders);
        if (!orders.length) {
          const message = searchTerm ? "Try a different search or filter." : "New packages will appear after your next Gmail sync.";
          $("orders").innerHTML = `<div class="empty"><strong>No matching orders</strong><span>${message}</span></div>`;
          return;
        }

        $("orders").innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Received</th>
                <th>Item</th>
                <th>Status</th>
                <th>ETA</th>
                <th>Tracking</th>
                <th>Signal</th>
              </tr>
            </thead>
            <tbody>
              ${orders.map(renderOrderRow).join("")}
            </tbody>
          </table>
        `;

        document.querySelectorAll("[data-received-row]").forEach((input) => {
          input.addEventListener("change", () => setReceived(Number(input.dataset.receivedRow), input.checked));
        });
        document.querySelectorAll("[data-status-row]").forEach((select) => {
          select.addEventListener("change", () => updateStatus(Number(select.dataset.statusRow), select.value));
        });
        restoreFocusAfterRender();
      }

      function renderOrderRow(order) {
        const signal = getSignal(order);
        const trackingText = [order.carrier, order.trackingNumber].filter(Boolean).join(" ");
        return `
          <tr>
            <td data-label="Received"><label class="received-control"><input class="received" type="checkbox" aria-label="Mark ${escapeAttr(order.item || order.store || "order")} as received" ${order.received ? "checked" : ""} data-received-row="${order.rowIndex}"></label></td>
            <td data-label="Item">
              <div class="item-title">${escapeHtml(order.item || order.store || "Untitled order")}</div>
              <div class="item-sub">${escapeHtml([order.store, order.orderNumber].filter(Boolean).join(" - "))}</div>
            </td>
            <td data-label="Status">
              <select class="status" aria-label="Status for ${escapeAttr(order.item || order.store || "order")}" data-status-row="${order.rowIndex}">
                ${statusOptions.map((status) => `<option ${status === order.status ? "selected" : ""}>${escapeHtml(status)}</option>`).join("")}
              </select>
            </td>
            <td data-label="ETA">${escapeHtml(order.estimatedArrival || "Not set")}</td>
            <td data-label="Tracking">
              ${safeTrackingUrl(order.trackingUrl) ? `<a href="${escapeAttr(safeTrackingUrl(order.trackingUrl))}" target="_blank" rel="noopener noreferrer">${escapeHtml(trackingText || "Track package")}</a>` : escapeHtml(trackingText)}
              <div class="item-sub">${escapeHtml(order.notes || "")}</div>
            </td>
            <td data-label="Signal"><span class="pill ${signal.key}">${escapeHtml(signal.label)}</span></td>
          </tr>
        `;
      }

      function matchesFilter(order) {
        const signal = getSignal(order).key;
        if (activeFilter === "all") return true;
        if (activeFilter === "open") return !order.received;
        if (activeFilter === "today") return signal === "today";
        if (activeFilter === "overdue") return signal === "overdue";
        if (activeFilter === "exception") return order.status === "Exception";
        if (activeFilter === "delivered") return !order.received && order.status === "Delivered";
        if (activeFilter === "missing") return signal === "missing";
        return true;
      }

      function matchesSearch(order) {
        if (!searchTerm) return true;
        return [
          order.store,
          order.item,
          order.orderNumber,
          order.carrier,
          order.trackingNumber,
          order.notes
        ].join(" ").toLowerCase().includes(searchTerm);
      }

      function sortOrders(a, b) {
        const aSignal = getSignal(a).rank;
        const bSignal = getSignal(b).rank;
        if (aSignal !== bSignal) return aSignal - bSignal;
        return (a.estimatedArrival || "9999-12-31").localeCompare(b.estimatedArrival || "9999-12-31");
      }

      function getSignal(order) {
        const today = state && state.today ? state.today : new Date().toISOString().slice(0, 10);
        if (order.received) return { key: "delivered", label: "Received", rank: 8 };
        if (order.status === "Exception") return { key: "exception", label: "Exception", rank: 0 };
        if (order.status === "Delivered") return { key: "delivered", label: "Delivered", rank: 3 };
        if (order.estimatedArrival && order.estimatedArrival < today) return { key: "overdue", label: "Overdue", rank: 1 };
        if (order.estimatedArrival === today) return { key: "today", label: "Due Today", rank: 2 };
        if (!order.estimatedArrival) return { key: "missing", label: "Missing ETA", rank: 6 };
        return { key: "", label: "Expected", rank: 5 };
      }

      function openModal() {
        lastFocusedElement = document.activeElement;
        $("manualForm").reset();
        $("modalBackdrop").classList.add("open");
        $("modalBackdrop").setAttribute("aria-hidden", "false");
        $("app").inert = true;
        document.body.style.overflow = "hidden";
        $("store").focus();
      }

      function closeModal() {
        $("modalBackdrop").classList.remove("open");
        $("modalBackdrop").setAttribute("aria-hidden", "true");
        $("app").inert = false;
        document.body.style.overflow = "";
        if (lastFocusedElement) lastFocusedElement.focus();
      }

      function handleKeydown(event) {
        const isOpen = $("modalBackdrop").classList.contains("open");
        if (event.key === "Escape" && isOpen) {
          closeModal();
        }
        if (event.key === "Tab" && isOpen) {
          const focusable = Array.from($("manualForm").querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled)'));
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      }

      function setBusy(isBusy) {
        document.body.style.cursor = isBusy ? "progress" : "";
        document.body.setAttribute("aria-busy", String(Boolean(isBusy)));
        document.querySelectorAll("button, input, select, textarea").forEach((node) => {
          if (node.id !== "search") node.disabled = Boolean(isBusy);
        });
      }

      function showError(error) {
        setBusy(false);
        focusAfterRender = "";
        const message = error && error.message ? error.message : String(error);
        if (!state) {
          $("orders").innerHTML = `<div class="error-state"><strong>TrackerPal couldn’t load</strong><span>${escapeHtml(message)}</span><button class="btn primary" type="button" onclick="loadState()">Try again</button></div>`;
        }
        toast(message, true);
      }

      function toast(message, isError) {
        const node = $("toast");
        node.textContent = message;
        node.setAttribute("role", isError ? "alert" : "status");
        node.setAttribute("aria-live", isError ? "assertive" : "polite");
        node.style.background = isError ? "var(--red)" : "var(--green)";
        node.classList.add("show");
        setTimeout(() => node.classList.remove("show"), 3600);
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      function safeTrackingUrl(value) {
        if (!value) return "";
        try {
          const parsed = new URL(String(value));
          return parsed.protocol === "https:" || parsed.protocol === "http:" ? parsed.href : "";
        } catch (error) {
          return "";
        }
      }

      function restoreFocusAfterRender() {
        if (!focusAfterRender) return;
        const target = document.querySelector(focusAfterRender);
        focusAfterRender = "";
        if (target) target.focus();
      }
    </script>
  </body>
</html>
